{% extends "base.html" %}
{% block body %}
<form class="card login" method="post">
  {{ csrf() }}
  <h2>처음 설정 — 관리자 계정 만들기</h2>
  <p class="sub">이 계정으로 사용자와 문서 종류를 관리합니다.</p>
  <p><label>아이디</label><input type="text" name="username" required autofocus></p>
  <p><label>이름</label><input type="text" name="name" required></p>
  <p><label>비밀번호 (8자 이상)</label><input type="password" name="password" required minlength="8"></p>
  <p><label>비밀번호 확인</label><input type="password" name="password2" required minlength="8"></p>
  <button class="btn">만들기</button>
</form>
{% endblock %}
