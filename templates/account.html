{% extends "base.html" %}
{% block body %}
<form class="card login" method="post">
  {{ csrf() }}
  <h2>비밀번호 변경</h2>
  <p><label>현재 비밀번호</label><input type="password" name="current" required></p>
  <p><label>새 비밀번호 (8자 이상)</label><input type="password" name="password" required minlength="8"></p>
  <p><label>새 비밀번호 확인</label><input type="password" name="password2" required minlength="8"></p>
  <button class="btn">변경</button>
</form>
{% endblock %}
